name: Test and deploy

# Pushes to main and pull requests are only checked (analysis, tests, web
# build); pushes to main also keep the Android build's Gradle cache warm
# for the tags. Publishing happens only with a version tag: v0.2.0 deploys the web
# to https://juego.chiguibara.es and sends the Android app to Google Play
# production; v0.2.0-rc.1 sends it only to Play's closed testing, and
# v0.2.0-beta.1 only to internal testing, with the notes in
# distribution/whatsnew/ as "What's new". Manual runs from the Actions tab
# build the Android app bundle, or, given a version tag (e.g. a release
# candidate already in testing), check it and publish only its web.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      web_tag:
        description: "Publish only the web from this tag (e.g. v1.0.3-rc.3). Empty: just build the Android app bundle."
        required: false
        type: string

# Least privilege: the workflow only reads the code. Pull requests from
# forks never receive secrets, and only main deploys.
permissions:
  contents: read

# A newer run of the same ref replaces an older one; web-only runs get their
# own group, so pushes to main and web publishing never cancel each other.
concurrency:
  group: deploy-${{ github.ref }}-${{ inputs.web_tag }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The same Flutter image as the local Docker toolchain.
    container: ghcr.io/cirruslabs/flutter:3.44.0
    steps:
      - if: inputs.web_tag
        name: Check the tag is a version tag
        shell: bash
        env:
          TAG: ${{ inputs.web_tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9] ]]; then
            echo "::error::$TAG is not a version tag (v1.0.3, v1.0.3-rc.1…)"; exit 1
          fi
      - uses: actions/checkout@v5
        with:
          # A web-only run checks and builds the chosen tag; the run itself
          # uses main's workflow, so older tags work too.
          ref: ${{ inputs.web_tag && format('refs/tags/{0}', inputs.web_tag) || github.ref }}
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tools
      - run: flutter analyze
      - run: flutter test
      # Like the app bundle: the tag sets the version (v0.2.0 -> 0.2.0) and
      # each run its own build number, so every deploy has a new
      # version.json and tabs left open notice it (lib/update/).
      - name: Build the web
        shell: bash
        env:
          TAG: ${{ inputs.web_tag || github.ref_name }}
        run: |
          VERSION=1.0.0
          if [[ "$TAG" == v[0-9]* ]]; then VERSION="${TAG#v}"; fi
          flutter build web --release --no-web-resources-cdn --build-name="${VERSION%%-*}" --build-number=$GITHUB_RUN_NUMBER
      - run: find build/web -name '*.symbols' -delete
      - if: startsWith(github.ref, 'refs/tags/v') || inputs.web_tag
        uses: actions/upload-artifact@v5
        with:
          name: web
          path: build/web
          include-hidden-files: true

  # Builds the signed app bundle for version tags (and manual runs). On
  # pushes to main it only keeps the Gradle cache warm: a cache saved by a
  # tag is visible to that tag alone, while main's caches are visible to
  # every tag. So main builds (unsigned, nothing uploaded) only when the
  # cache key changed, and otherwise stops after a quick lookup.
  android:
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && !inputs.web_tag)
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.44.0
    env:
      ON_MAIN: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v5
      # Paths and key must match the cache step below exactly.
      - id: warm
        if: env.ON_MAIN == 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            /opt/android-sdk-linux/ndk
            /opt/android-sdk-linux/cmake
            /opt/android-sdk-linux/platforms/android-35
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ hashFiles('android/**/*.kts', 'android/gradle/wrapper/*.properties', 'pubspec.lock') }}
          lookup-only: true
      # The NDK, extra SDK parts, and Gradle downloads are cached between runs.
      - if: steps.warm.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: |
            /opt/android-sdk-linux/ndk
            /opt/android-sdk-linux/cmake
            /opt/android-sdk-linux/platforms/android-35
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ hashFiles('android/**/*.kts', 'android/gradle/wrapper/*.properties', 'pubspec.lock') }}
          restore-keys: android-
      - if: steps.warm.outputs.cache-hit != 'true'
        run: yes | sdkmanager --install "ndk;28.2.13676358" "platforms;android-35" "cmake;3.22.1" > /dev/null
      - if: steps.warm.outputs.cache-hit != 'true'
        run: flutter pub get
      # Main only warms the cache: without the upload key, the build uses
      # the debug key.
      - name: Sign with the upload key
        if: env.ON_MAIN != 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=upload
          keyPassword=$KEY_PASSWORD
          EOF
      # Version tags set the app version (v0.2.0 -> 0.2.0); the version code
      # always grows with each run, as Google Play requires. Downloads from
      # GitHub and Maven sometimes time out, so a failed build is retried
      # twice, a minute apart.
      - name: Build the app bundle
        if: steps.warm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          VERSION=1.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          for attempt in 1 2 3; do
            flutter build appbundle --release --build-name="${VERSION%%-*}" --build-number=$GITHUB_RUN_NUMBER && exit 0
            if (( attempt < 3 )); then
              echo "::warning::build attempt $attempt failed, retrying in a minute"
              sleep 60
            fi
          done
          exit 1
      # Release builds must never ask for the internet (see CLAUDE.md). The
      # bundle's manifest is binary, but permission names are plain text in it.
      - name: Check the app does not request the internet
        if: steps.warm.outputs.cache-hit != 'true'
        shell: bash
        run: |
          if unzip -p build/app/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml \
              | grep -aq 'android.permission.INTERNET'; then
            echo "::error::the app bundle requests the INTERNET permission"; exit 1
          fi
      - if: env.ON_MAIN != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: chigui-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  # Google Play shows distribution/whatsnew/ as the release's "What's new"
  # (one file per store listing language, 500 characters at most). Each
  # version brings its own: they must have changed since the previous
  # production tag, so test tags of a version share them with its final tag.
  # The game also shows them once after an update, with Catalan ones from
  # distribution/whatsnew-game/ (not uploaded to Play), which must change
  # too. The release-notes skill writes them.
  release-notes:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Check the release notes
        shell: bash
        run: |
          dir=distribution/whatsnew
          for f in "$dir"/whatsnew-*; do
            length=$(python3 -c 'import sys; print(len(open(sys.argv[1], encoding="utf-8").read().strip()))' "$f")
            if (( length == 0 || length > 500 )); then
              echo "::error file=$f::release notes must have 1 to 500 characters, not $length"; exit 1
            fi
          done
          previous=$(git describe --tags --abbrev=0 --match 'v*' --exclude '*-*' "$GITHUB_SHA^" 2>/dev/null || true)
          for d in "$dir" distribution/whatsnew-game; do
            if [[ -n "$previous" ]] && git diff --quiet "$previous" "$GITHUB_SHA" -- "$d"; then
              echo "::error::$d has not changed since $previous; write this version's notes"; exit 1
            fi
          done

  # v0.2.0 goes to production (Google reviews it, then it is published);
  # v0.2.0-rc.1 to closed testing (the "alpha" track) and v0.2.0-beta.1 to
  # internal testing only.
  google-play:
    needs: [build, android, release-notes]
    # Only pushed tags: manual runs never upload to Google Play.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: google-play
      url: https://play.google.com/store/apps/details?id=es.chiguibara.chigui_game
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: distribution
      - uses: actions/download-artifact@v5
        with:
          name: chigui-aab
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: es.chiguibara.chigui_game
          releaseFiles: app-release.aab
          releaseName: ${{ github.ref_name }}
          whatsNewDirectory: distribution/whatsnew
          track: ${{ contains(github.ref_name, '-rc.') && 'alpha' || contains(github.ref_name, '-') && 'internal' || 'production' }}
          status: completed

  deploy:
    needs: build
    # Test tags (v0.2.0-rc.1, v0.2.0-beta.1) are only for Android testers,
    # unless a manual run publishes one's web.
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') &&
      !contains(github.ref_name, '-')) || inputs.web_tag
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://juego.chiguibara.es
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web
          path: build/web
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler 4 deploys asset-only Workers (no script).
          wranglerVersion: "4"
          command: deploy
