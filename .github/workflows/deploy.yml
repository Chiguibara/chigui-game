name: Test and deploy

# Pushes to main and pull requests are only checked (analysis, tests, web
# build). Publishing happens only with a version tag: v0.2.0 deploys the web
# to https://juego.chiguibara.es and sends the Android app to Google Play
# production; v0.2.0-beta.1 sends it only to Play's internal testing. Manual
# runs from the Actions tab also build the Android app bundle.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the code. Pull requests from
# forks never receive secrets, and only main deploys.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The same Flutter image as the local Docker toolchain.
    container: ghcr.io/cirruslabs/flutter:3.44.0
    steps:
      - uses: actions/checkout@v5
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed lib test tools
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - run: find build/web -name '*.symbols' -delete
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v5
        with:
          name: web
          path: build/web
          include-hidden-files: true

  android:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.44.0
    steps:
      - uses: actions/checkout@v5
      # The NDK, extra SDK parts, and Gradle downloads are cached between runs.
      - uses: actions/cache@v4
        with:
          path: |
            /opt/android-sdk-linux/ndk
            /opt/android-sdk-linux/cmake
            /opt/android-sdk-linux/platforms/android-35
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ hashFiles('android/**/*.kts', 'android/gradle/wrapper/*.properties', 'pubspec.lock') }}
          restore-keys: android-
      - run: yes | sdkmanager --install "ndk;28.2.13676358" "platforms;android-35" "cmake;3.22.1" > /dev/null
      - run: flutter pub get
      - name: Sign with the upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        shell: bash
        run: |
          echo "$KEYSTORE" | base64 -d > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$STORE_PASSWORD
          keyAlias=upload
          keyPassword=$KEY_PASSWORD
          EOF
      # Version tags set the app version (v0.2.0 -> 0.2.0); the version code
      # always grows with each run, as Google Play requires.
      - name: Build the app bundle
        shell: bash
        run: |
          VERSION=1.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          flutter build appbundle --release --build-name="${VERSION%%-*}" --build-number=$GITHUB_RUN_NUMBER
      # Release builds must never ask for the internet (see CLAUDE.md). The
      # bundle's manifest is binary, but permission names are plain text in it.
      - name: Check the app does not request the internet
        shell: bash
        run: |
          if unzip -p build/app/outputs/bundle/release/app-release.aab base/manifest/AndroidManifest.xml \
              | grep -aq 'android.permission.INTERNET'; then
            echo "::error::the app bundle requests the INTERNET permission"; exit 1
          fi
      - uses: actions/upload-artifact@v5
        with:
          name: chigui-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 7

  # v0.2.0 goes to production (Google reviews it, then it is published);
  # v0.2.0-beta.1 goes to internal testing only.
  google-play:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: google-play
      url: https://play.google.com/store/apps/details?id=es.chiguibara.chigui_game
    steps:
      - uses: actions/download-artifact@v5
        with:
          name: chigui-aab
      - uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: es.chiguibara.chigui_game
          releaseFiles: app-release.aab
          releaseName: ${{ github.ref_name }}
          track: ${{ contains(github.ref_name, '-') && 'internal' || 'production' }}
          status: completed

  deploy:
    needs: build
    # Beta tags (v0.2.0-beta.1) are only for Android testers.
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://juego.chiguibara.es
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web
          path: build/web
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler 4 deploys asset-only Workers (no script).
          wranglerVersion: "4"
          command: deploy
