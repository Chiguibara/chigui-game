name: Test and deploy

# Pushes to main and pull requests are only checked (analysis, tests, web
# build). Publishing happens only with a version tag (v0.1.0): the web goes
# to https://juego.chiguibara.es and the Android test APKs to a GitHub
# pre-release. Manual runs from the Actions tab also build the APKs.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow only reads the code. Pull requests from
# forks never receive secrets, and only main deploys.
permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # The same Flutter image as the local Docker toolchain.
    container: ghcr.io/cirruslabs/flutter:3.44.0
    steps:
      - uses: actions/checkout@v5
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn
      - run: find build/web -name '*.symbols' -delete
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v5
        with:
          name: web
          path: build/web
          include-hidden-files: true

  android:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    container: ghcr.io/cirruslabs/flutter:3.44.0
    steps:
      - uses: actions/checkout@v5
      # The NDK, extra SDK parts, and Gradle downloads are cached between runs.
      - uses: actions/cache@v4
        with:
          path: |
            /opt/android-sdk-linux/ndk
            /opt/android-sdk-linux/cmake
            /opt/android-sdk-linux/platforms/android-35
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: android-${{ hashFiles('android/**/*.kts', 'android/gradle/wrapper/*.properties', 'pubspec.lock') }}
          restore-keys: android-
      - run: yes | sdkmanager --install "ndk;28.2.13676358" "platforms;android-35" "cmake;3.22.1" > /dev/null
      - run: flutter pub get
      # Version tags set the app version (v0.1.0 -> 0.1.0); the build number
      # always grows with each run.
      - name: Build APKs (one per CPU, plus a universal one)
        shell: bash
        run: |
          VERSION=1.0.0
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then VERSION="${GITHUB_REF_NAME#v}"; fi
          ARGS="--release --build-name=$VERSION --build-number=$GITHUB_RUN_NUMBER"
          flutter build apk $ARGS --split-per-abi
          flutter build apk $ARGS
          mkdir -p apks
          OUT=build/app/outputs/flutter-apk
          for abi in arm64-v8a armeabi-v7a x86_64; do
            cp "$OUT/app-$abi-release.apk" "apks/chigui-$abi.apk"
          done
          cp "$OUT/app-release.apk" apks/chigui-universal.apk
          ls -la apks
      # Release builds must never ask for the internet (see CLAUDE.md).
      - name: Check no APK requests the internet
        shell: bash
        run: |
          for apk in apks/*.apk; do
            if $ANDROID_HOME/build-tools/36.0.0/aapt2 dump permissions "$apk" | grep -q android.permission.INTERNET; then
              echo "::error::$apk requests the INTERNET permission"; exit 1
            fi
          done
      # Debug-signed test APKs; in this public repo anyone can download them.
      - uses: actions/upload-artifact@v5
        with:
          name: chigui-test-apks
          path: apks/*.apk
          retention-days: 7

  release:
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: chigui-test-apks
          path: apks
      - name: Publish the pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" apks/*.apk \
            --prerelease \
            --title "Chigüi $GITHUB_REF_NAME (pruebas Android)" \
            --notes-file .github/test-release-notes.md

  deploy:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://juego.chiguibara.es
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
        with:
          name: web
          path: build/web
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Wrangler 4 deploys asset-only Workers (no script).
          wranglerVersion: "4"
          command: deploy
